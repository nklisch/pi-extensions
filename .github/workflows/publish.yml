name: Publish Pi extension

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory/name, or all"
        required: true
        default: all
        type: string

concurrency:
  group: publish-pi-extensions
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  native:
    name: Build Clearance native (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build native engine
        run: npm run build:native:target --workspace @nklisch/pi-clearance -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi-clearance-native-${{ matrix.artifact }}
          path: packages/pi-clearance/native/clearance-core.${{ matrix.artifact }}.node
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-latest
    env:
      CI: "1"
      PI_PLUGIN_HOST_E2E_REQUIRE_PTY: "1"
      PI_PLUGIN_HOST_E2E_REQUIRE_LIBFAKETIME: "1"
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Packages may only be published from main (got $GITHUB_REF)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      # No registry-url: it injects a NODE_AUTH_TOKEN that shadows the OIDC
      # trusted-publishing exchange (E401). Trusted publishing needs id-token
      # only, configured per package via `npm trust`.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Install native test capabilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git util-linux libfaketime
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-clearance-native-*
          path: packages/pi-clearance/native
          merge-multiple: true
      - name: Build pi-mcp-adapter interactive visualizer (test fixture)
        run: |
          npm install --prefix packages/pi-mcp-adapter/examples/interactive-visualizer --package-lock=false --ignore-scripts
          npm run build --prefix packages/pi-mcp-adapter/examples/interactive-visualizer
      - name: Publish unpublished versions with OIDC provenance
        run: npm run publish:package -- "${{ inputs.package }}"
